<svg width="375" height="667" viewBox="0 0 375 667" xmlns="http://www.w3.org/2000/svg">
  <rect width="375" height="667" fill="#141414"/>
  
  <!-- Header -->
  <rect x="0" y="0" width="375" height="56" fill="#1f1f1f"/>
  <text x="20" y="35" fill="#00b96b" font-family="Arial, sans-serif" font-size="16" font-weight="bold">Waste Analysis</text>
  
  <!-- Status Card -->
  <rect x="16" y="72" width="343" height="80" rx="8" fill="#1f1f1f"/>
  <text x="32" y="95" fill="#8c8c8c" font-family="Arial, sans-serif" font-size="12">Current Analysis</text>
  <text x="32" y="120" fill="#00b96b" font-family="Arial, sans-serif" font-size="20" font-weight="bold">Batch #2847</text>
  <circle cx="320" cy="112" r="8" fill="#52c41a"/>
  
  <!-- Analysis Results -->
  <rect x="16" y="168" width="343" height="120" rx="8" fill="#1f1f1f"/>
  <text x="32" y="190" fill="#ffffff" font-family="Arial, sans-serif" font-size="14" font-weight="bold">Classification Results</text>
  <text x="32" y="215" fill="#8c8c8c" font-family="Arial, sans-serif" font-size="12">Material Type:</text>
  <text x="32" y="235" fill="#1890ff" font-family="Arial, sans-serif" font-size="14" font-weight="bold">Organic Waste</text>
  <text x="32" y="255" fill="#8c8c8c" font-family="Arial, sans-serif" font-size="12">Confidence: 94.2%</text>
  
  <!-- Progress Bar -->
  <rect x="32" y="265" width="280" height="8" rx="4" fill="#262626"/>
  <rect x="32" y="265" width="264" height="8" rx="4" fill="#00b96b"/>
  
  <!-- Composition Chart -->
  <rect x="16" y="304" width="343" height="180" rx="8" fill="#1f1f1f"/>
  <text x="32" y="326" fill="#ffffff" font-family="Arial, sans-serif" font-size="14" font-weight="bold">Composition Analysis</text>
  
  <!-- Pie Chart Representation -->
  <circle cx="187" cy="400" r="50" fill="none" stroke="#262626" stroke-width="4"/>
  <path d="M187 350 A50 50 0 0 1 237 400 L187 400 Z" fill="#00b96b"/>
  <path d="M237 400 A50 50 0 0 1 187 450 L187 400 Z" fill="#1890ff"/>
  <path d="M187 450 A50 50 0 0 1 137 400 L187 400 Z" fill="#faad14"/>
  <path d="M137 400 A50 50 0 0 1 187 350 L187 400 Z" fill="#f5222d"/>
  
  <!-- Legend -->
  <rect x="260" y="360" width="12" height="12" fill="#00b96b"/>
  <text x="280" y="370" fill="#ffffff" font-family="Arial, sans-serif" font-size="10">Organic 65%</text>
  
  <rect x="260" y="380" width="12" height="12" fill="#1890ff"/>
  <text x="280" y="390" fill="#ffffff" font-family="Arial, sans-serif" font-size="10">Plastic 20%</text>
  
  <rect x="260" y="400" width="12" height="12" fill="#faad14"/>
  <text x="280" y="410" fill="#ffffff" font-family="Arial, sans-serif" font-size="10">Metal 10%</text>
  
  <rect x="260" y="420" width="12" height="12" fill="#f5222d"/>
  <text x="280" y="430" fill="#ffffff" font-family="Arial, sans-serif" font-size="10">Other 5%</text>
  
  <!-- Action Buttons -->
  <rect x="16" y="500" width="343" height="48" rx="8" fill="#00b96b"/>
  <text x="187" y="528" text-anchor="middle" fill="#ffffff" font-family="Arial, sans-serif" font-size="16" font-weight="bold">Start New Analysis</text>
  
  <rect x="16" y="564" width="165" height="40" rx="6" fill="#1f1f1f" stroke="#00b96b" stroke-width="1"/>
  <text x="98" y="588" text-anchor="middle" fill="#00b96b" font-family="Arial, sans-serif" font-size="14">View History</text>
  
  <rect x="194" y="564" width="165" height="40" rx="6" fill="#1f1f1f" stroke="#00b96b" stroke-width="1"/>
  <text x="276" y="588" text-anchor="middle" fill="#00b96b" font-family="Arial, sans-serif" font-size="14">Export Results</text>
  
  <!-- Bottom Navigation -->
  <rect x="0" y="620" width="375" height="47" fill="#1f1f1f"/>
  <circle cx="75" cy="643" r="4" fill="#8c8c8c"/>
  <circle cx="187" cy="643" r="4" fill="#00b96b"/>
  <circle cx="299" cy="643" r="4" fill="#8c8c8c"/>
</svg>