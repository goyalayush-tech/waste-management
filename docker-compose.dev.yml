version: '3.8'

services:
  backend:
    build:
      target: development
    volumes:
      - ./backend:/app
      - /app/node_modules
    command: npm run dev
    environment:
      - NODE_ENV=development
      - DEBUG=waste-verification:*

  ai-service:
    build:
      target: development
    volumes:
      - ./ai-services:/app
    command: uvicorn main:app --reload --host 0.0.0.0 --port 8001
    environment:
      - DEBUG=true
      - LOG_LEVEL=DEBUG

  frontend:
    build:
      target: development
    volumes:
      - ./frontend:/app
      - /app/node_modules
    command: npm run dev -- --host 0.0.0.0
    environment:
      - VITE_DEBUG=true